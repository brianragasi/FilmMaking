name: Deploy EcoCart to GoogieHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ecocart-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build DaisyUI stylesheet
        run: |
          npm ci
          npm run build:css

      - name: Validate JavaScript
        run: |
          node --check assets/app-public.js
          node --check assets/app.js
          node --check assets/director.js
          node --check assets/scene-client.js

      - name: Create production database config
        env:
          DB_HOST: ${{ secrets.GOOGIEHOST_DB_HOST }}
          DB_NAME: ${{ secrets.GOOGIEHOST_DB_NAME }}
          DB_USER: ${{ secrets.GOOGIEHOST_DB_USER }}
          DB_PASSWORD: ${{ secrets.GOOGIEHOST_DB_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.GOOGIEHOST_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.GOOGIEHOST_ADMIN_PASSWORD }}
          DIRECTOR_EMAIL: ${{ secrets.GOOGIEHOST_DIRECTOR_EMAIL }}
          DIRECTOR_PASSWORD: ${{ secrets.GOOGIEHOST_DIRECTOR_PASSWORD }}
        run: |
          test -n "$DB_HOST"
          test -n "$DB_NAME"
          test -n "$DB_USER"
          test -n "$DB_PASSWORD"
          php -r '
          $config = [
              "host" => getenv("DB_HOST"),
              "name" => getenv("DB_NAME"),
              "user" => getenv("DB_USER"),
              "pass" => getenv("DB_PASSWORD"),
          ];
          $adminEmail = strtolower(trim((string) getenv("ADMIN_EMAIL")));
          $directorEmail = strtolower(trim((string) getenv("DIRECTOR_EMAIL")));
          if ($adminEmail !== "" && $directorEmail !== "" && hash_equals($adminEmail, $directorEmail)) {
              fwrite(STDERR, "Admin and Director must use different email addresses.\n");
              exit(1);
          }
          if (getenv("ADMIN_EMAIL") && getenv("ADMIN_PASSWORD")) {
              $config["admin_email"] = $adminEmail;
              $config["admin_password_hash"] = password_hash(getenv("ADMIN_PASSWORD"), PASSWORD_DEFAULT);
          }
          if (getenv("DIRECTOR_EMAIL") && getenv("DIRECTOR_PASSWORD")) {
              $config["director_email"] = $directorEmail;
              $config["director_password_hash"] = password_hash(getenv("DIRECTOR_PASSWORD"), PASSWORD_DEFAULT);
          }
          file_put_contents("includes/config.local.php", "<?php\nreturn " . var_export($config, true) . ";\n");
          '

      - name: Deploy runtime files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.GOOGIEHOST_FTP_SERVER }}
          username: ${{ secrets.GOOGIEHOST_FTP_USERNAME }}
          password: ${{ secrets.GOOGIEHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /public_html/
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tmp/**
            **/dist/**
            **/release/**
            **/installer/**
            **/*.log
            **/*.md
            **/*.pdf
            **/package.json
            **/package-lock.json
            **/assets/app.css
            **/assets/app-public.css
            **/assets/app.js
            **/assets/images/swarmgrid-c2-icon.png
            **/public/output.css
            **/database/**
            **/story.txt
            **/attacker-terminal.php
            **/index.html
            **/main.js
            **/preload.js
            **/includes/order-queue.jsonl
            **/includes/scene-state.json
